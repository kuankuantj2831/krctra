<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krctra - 极简纯净搜索引擎</title>
  <style>
  <style>
    /* ----------------------------------------------------
       1. 全局与主题样式：支持多种背景色切换、自定义背景图片与默认纯白极简
       ---------------------------------------------------- */
    :root {
      /* 默认纯白主题 (Light / Pure White) - 舒适护眼，简洁明快 */
      --bg-color: #f8fafc;
      --bg-gradient: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --brand-title-gradient: linear-gradient(135deg, #2563eb 0%, #7c3aed 50%, #db2777 100%);
      --brand-text-shadow: 0 4px 20px rgba(124, 58, 237, 0.15);
      
      --search-bg: rgba(255, 255, 255, 0.9);
      --search-border: rgba(203, 213, 225, 0.8);
      --search-border-focus: #7c3aed;
      --search-shadow: 0 8px 24px rgba(148, 163, 184, 0.25);
      --search-input-color: #0f172a;
      
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(226, 232, 240, 0.9);
      --card-border-hover: rgba(168, 85, 247, 0.45);
      --card-shadow: 0 4px 18px rgba(148, 163, 184, 0.16);
      --card-title-color: #1d4ed8;
      --card-title-hover: #2563eb;
      --card-url-color: #059669;
      --card-snippet-color: #334155;
      --card-snippet-mark-bg: rgba(253, 224, 71, 0.65);
      --card-snippet-mark-color: #713f12;

      --modal-bg: rgba(255, 255, 255, 0.98);
      --modal-border: rgba(226, 232, 240, 0.9);
      --modal-title-color: #0f172a;
      --source-item-bg: rgba(241, 245, 249, 0.7);
      --source-item-border: rgba(226, 232, 240, 0.8);

      --banner-bg: rgba(255, 255, 255, 0.96);
      --banner-border: rgba(168, 85, 247, 0.4);
      --banner-content-bg: #f8fafc;
      --banner-content-color: #0f172a;
      --banner-shadow: 0 10px 30px rgba(124, 58, 237, 0.12);
    }

    /* 深邃暗夜紫 (Dark Purple) 主题 */
    body.theme-purple {
      --bg-color: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 35%, #311042 70%, #0f172a 100%);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --brand-title-gradient: linear-gradient(120deg, #60a5fa, #c084fc, #f472b6);
      --brand-text-shadow: 0 0 35px rgba(192, 132, 252, 0.35);

      --search-bg: rgba(255, 255, 255, 0.08);
      --search-border: rgba(255, 255, 255, 0.15);
      --search-border-focus: rgba(192, 132, 252, 0.7);
      --search-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      --search-input-color: #ffffff;

      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(168, 85, 247, 0.35);
      --card-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      --card-title-color: #67e8f9;
      --card-title-hover: #a5f3fc;
      --card-url-color: #10b981;
      --card-snippet-color: #cbd5e1;
      --card-snippet-mark-bg: rgba(244, 114, 182, 0.3);
      --card-snippet-mark-color: #fbcfe8;

      --modal-bg: rgba(30, 27, 75, 0.96);
      --modal-border: rgba(255, 255, 255, 0.16);
      --modal-title-color: #f8fafc;
      --source-item-bg: rgba(255, 255, 255, 0.04);
      --source-item-border: rgba(255, 255, 255, 0.08);

      --banner-bg: rgba(30, 27, 75, 0.88);
      --banner-border: rgba(168, 85, 247, 0.45);
      --banner-content-bg: rgba(15, 23, 42, 0.6);
      --banner-content-color: #f1f5f9;
      --banner-shadow: 0 12px 35px rgba(147, 51, 234, 0.22);
    }

    /* 优雅暗黑墨黑 (Dark Clean) 主题 */
    body.theme-dark {
      --bg-color: #121212;
      --bg-gradient: linear-gradient(180deg, #18181b 0%, #09090b 100%);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --brand-title-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
      --brand-text-shadow: 0 4px 25px rgba(56, 189, 248, 0.2);

      --search-bg: rgba(255, 255, 255, 0.06);
      --search-border: rgba(255, 255, 255, 0.12);
      --search-border-focus: #38bdf8;
      --search-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      --search-input-color: #ffffff;

      --card-bg: rgba(24, 24, 27, 0.8);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-border-hover: rgba(56, 189, 248, 0.4);
      --card-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
      --card-title-color: #38bdf8;
      --card-title-hover: #7dd3fc;
      --card-url-color: #34d399;
      --card-snippet-color: #d4d4d8;
      --card-snippet-mark-bg: rgba(56, 189, 248, 0.25);
      --card-snippet-mark-color: #bae6fd;

      --modal-bg: rgba(24, 24, 27, 0.96);
      --modal-border: rgba(255, 255, 255, 0.12);
      --modal-title-color: #fafafa;
      --source-item-bg: rgba(255, 255, 255, 0.04);
      --source-item-border: rgba(255, 255, 255, 0.08);

      --banner-bg: rgba(24, 24, 27, 0.9);
      --banner-border: rgba(56, 189, 248, 0.4);
      --banner-content-bg: #09090b;
      --banner-content-color: #fafafa;
      --banner-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
    }

    /* 清爽天蓝护眼 (Ocean Blue) 主题 */
    body.theme-blue {
      --bg-color: #f0f9ff;
      --bg-gradient: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%);
      --text-main: #0c4a6e;
      --text-muted: #475569;
      --brand-title-gradient: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      --brand-text-shadow: 0 4px 20px rgba(2, 132, 199, 0.15);

      --search-bg: rgba(255, 255, 255, 0.92);
      --search-border: rgba(186, 230, 253, 0.9);
      --search-border-focus: #0284c7;
      --search-shadow: 0 8px 24px rgba(186, 230, 253, 0.4);
      --search-input-color: #0369a1;

      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(224, 242, 254, 0.9);
      --card-border-hover: rgba(2, 132, 199, 0.4);
      --card-shadow: 0 4px 18px rgba(186, 230, 253, 0.25);
      --card-title-color: #0284c7;
      --card-title-hover: #0369a1;
      --card-url-color: #059669;
      --card-snippet-color: #334155;
      --card-snippet-mark-bg: rgba(186, 230, 253, 0.7);
      --card-snippet-mark-color: #0369a1;

      --modal-bg: rgba(255, 255, 255, 0.98);
      --modal-border: rgba(186, 230, 253, 0.8);
      --modal-title-color: #0c4a6e;
      --source-item-bg: rgba(240, 249, 255, 0.8);
      --source-item-border: rgba(224, 242, 254, 0.9);

      --banner-bg: rgba(255, 255, 255, 0.95);
      --banner-border: rgba(2, 132, 199, 0.4);
      --banner-content-bg: #f0f9ff;
      --banner-content-color: #0c4a6e;
      --banner-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
    }

    /* 自定义上传图片背景状态 */
    body.has-custom-bg {
      background-size: cover !important;
      background-position: center center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px 20px;
      transition: background 0.4s ease, color 0.3s ease;
    }

    body.theme-purple {
      background-size: 300% 300%;
      animation: gradientBG 15s ease infinite;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ----------------------------------------------------
       2. 标题 Logo 设计：发光与渐变字色
       ---------------------------------------------------- */
    .header {
      text-align: center;
      margin-top: 30px;
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 3.8rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: var(--brand-title-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: var(--brand-text-shadow);
      user-select: none;
      cursor: default;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .brand-title:hover {
      transform: scale(1.04);
    }

    .brand-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 6px;
      letter-spacing: 1px;
    }

    /* ----------------------------------------------------
       3. 搜索栏设计：毛玻璃效果与聚焦呼吸动画
       ---------------------------------------------------- */
    .search-container {
      width: 100%;
      max-width: 720px;
      position: relative;
      margin-bottom: 14px;
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background: var(--search-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--search-border);
      border-radius: 9999px;
      padding: 6px 10px 6px 22px;
      box-shadow: var(--search-shadow), inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .search-box:focus-within {
      border-color: var(--search-border-focus);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.25), 0 0 0 3px rgba(124, 58, 237, 0.15);
      transform: translateY(-2px);
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 1.1rem;
      color: var(--search-input-color);
      padding: 10px 8px;
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-btn {
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      outline: none;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
    }

    .search-btn:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 18px rgba(147, 51, 234, 0.5);
    }

    .search-btn:active {
      transform: scale(0.98);
    }

    /* ----------------------------------------------------
       右上角设置按钮与弹出层面板设计 (SVG 小齿轮，无 Emoji)
       ---------------------------------------------------- */
    .top-settings-btn {
      position: fixed;
      top: 24px;
      right: 28px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--search-bg);
      border: 1px solid var(--search-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--search-shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      outline: none;
    }

    .top-settings-btn:hover {
      transform: rotate(45deg) scale(1.08);
      border-color: var(--search-border-focus);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
    }

    .top-settings-btn svg {
      width: 22px;
      height: 22px;
      transition: transform 0.3s ease;
    }

    /* 设置遮罩与弹出层模态框 */
    .settings-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 1001;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .settings-modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .settings-modal {
      width: 90%;
      max-width: 540px;
      max-height: 85vh;
      overflow-y: auto;
      background: var(--modal-bg);
      border: 1.5px solid var(--modal-border);
      border-radius: 20px;
      padding: 24px 26px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.3);
      transform: translateY(20px) scale(0.96);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--text-main);
    }

    .settings-modal-overlay.open .settings-modal {
      transform: translateY(0) scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--modal-title-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1.5rem;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .modal-close-btn:hover {
      background: rgba(148, 163, 184, 0.15);
      color: var(--text-main);
    }

    .settings-section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 16px 0 10px 0;
      color: var(--modal-title-color);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 主题与壁纸切换选择器 */
    .theme-palette-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .theme-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 6px;
      border-radius: 12px;
      border: 2px solid var(--card-border);
      background: var(--source-item-bg);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-chip:hover {
      transform: translateY(-2px);
      border-color: var(--card-border-hover);
    }

    .theme-chip.active {
      border-color: #7c3aed;
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.25);
    }

    .theme-color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1.5px solid rgba(0, 0, 0, 0.1);
    }

    .theme-chip-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .custom-bg-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--source-item-bg);
      border: 1px solid var(--source-item-border);
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 18px;
    }

    .custom-bg-btn {
      background: rgba(124, 58, 237, 0.15);
      color: #7c3aed;
      border: 1px solid rgba(124, 58, 237, 0.35);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-bg-btn:hover {
      background: #7c3aed;
      color: #ffffff;
    }

    .custom-bg-btn-clear {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .custom-bg-btn-clear:hover {
      color: #ef4444;
      border-color: #ef4444;
    }

    .custom-bg-tip {
      font-size: 0.78rem;
      color: var(--text-muted);
      flex: 1;
    }

    .settings-sources-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }

    .source-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--source-item-bg);
      border: 1px solid var(--source-item-border);
      transition: background 0.2s ease;
    }

    .source-item:hover {
      border-color: var(--card-border-hover);
    }

    .source-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .source-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .source-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .source-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #a855f7;
    }

    .modal-save-btn {
      width: 100%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      color: #ffffff;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.35);
    }

    .modal-save-btn:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    /* ----------------------------------------------------
       4. 提示与状态信息
       ---------------------------------------------------- */
    .status-msg {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.95rem;
      min-height: 24px;
      margin-bottom: 20px;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 50%;
      border-top-color: #7c3aed;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ----------------------------------------------------
       5. 搜索结果卡片及淡入动画
       ---------------------------------------------------- */
    .results-container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .result-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
      opacity: 0;
      transform: translateY(18px);
      animation: fadeInCard 0.45s ease forwards;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }

    .result-card.tool-direct {
      border: 1.5px solid rgba(16, 185, 129, 0.5);
      background: rgba(16, 185, 129, 0.06);
    }

    .result-card:hover {
      transform: translateY(-3px);
      border-color: var(--card-border-hover);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    }

    @keyframes fadeInCard {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge-source {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.15);
      color: #6366f1;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }

    .badge-source.badge-direct {
      background: rgba(16, 185, 129, 0.15);
      color: #059669;
      border-color: rgba(16, 185, 129, 0.35);
    }

    .badge-score {
      font-size: 0.75rem;
      color: #059669;
      background: rgba(16, 185, 129, 0.12);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .result-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .result-title a {
      color: var(--card-title-color);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .result-title a:hover {
      color: var(--card-title-hover);
      text-decoration: underline;
    }

    .result-url {
      font-size: 0.8rem;
      color: var(--card-url-color);
      margin-bottom: 6px;
      word-break: break-all;
    }

    .result-snippet {
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--card-snippet-color);
    }

    .result-snippet mark {
      background-color: var(--card-snippet-mark-bg);
      color: var(--card-snippet-mark-color);
      border-radius: 2px;
      padding: 1px 3px;
    }

    /* ----------------------------------------------------
       置顶解密面板与一键操作样式
       ---------------------------------------------------- */
    .decrypt-banner {
      width: 100%;
      max-width: 720px;
      margin: 0 auto 24px auto;
      background: var(--banner-bg);
      border: 1.5px solid var(--banner-border);
      border-radius: 18px;

    let currentTheme = "white"; // 默认纯白

    function applyTheme(themeName) {
      currentTheme = themeName;
      document.body.classList.remove("theme-purple", "theme-dark", "theme-blue");

      if (themeName === "purple") {
        document.body.classList.add("theme-purple");

      } else if (themeName === "blue") {

    /**

    // 常用中文核心词库（涵盖日常生活、网络工具、科技、娱乐、游戏、知识）

    // 常用高频英文核心词库（涵盖常用基础词、技术词汇、常用网站工具）
    const COMMON_ENGLISH_WORDS = new Set([
      "speed", "speedtest", "fast", "test", "network", "ping", "wifi",

    /**
     * 第一项功能：从中文乱码或随意打字中提取有价值的词语
     * 例如："asdfjh测速qwe" -> "测速"
     * 例如："乱打字网络测速哈哈" -> "网络测速"
     */
    function extractChineseUsefulTerms(text) {
      if (!text) return [];
      const results = [];

      // 1. 优先扫描预置的高价值中文词表（正向最大匹配）
      for (const word of COMMON_CHINESE_WORDS) {
        if (text.includes(word)) {
          results.push(word);
        }
      }

      // 2. 提取所有连续的汉字片段（过滤单字杂音，保留 2 个字以上的中文块）
      const continuousChinese = text.match(/[\u4e00-\u9fa5]{2,}/g) || [];
      for (const chunk of continuousChinese) {
        // 如果没有被已收录的完整词覆盖，作为候选词放入
        if (!results.some(w => w.includes(chunk) || chunk.includes(w))) {
          results.push(chunk);
        }
      }

      return results;
    }

    /**
     * 第二项功能：从英文乱码/连打字母中提取常用英语词汇
     * 例如："dfgspeedtestzx" -> 提取出 "speedtest"
     * 例如："xxyyzzgithubaabb" -> 提取出 "github"
     */
    function extractEnglishUsefulTerms(text) {
      if (!text) return [];
      const results = [];
      const lower = text.toLowerCase();

      // 1. 在整串文本中滑动扫描是否包含高频常用英文词
      for (const word of COMMON_ENGLISH_WORDS) {
        if (lower.includes(word)) {
          results.push(word);
        }
      }

      // 2. 提取以字母构成的连续段落，如果本身长度适中且符合拼音词典
      const letterBlocks = (lower.match(/[a-z]{2,}/g) || []);
      for (const block of letterBlocks) {
        if (COMMON_ENGLISH_WORDS.has(block)) {
          if (!results.includes(block)) results.push(block);
        } else if (PINYIN_COMMON_WORDS[block]) {
          // 拼音识别
          if (!results.includes(PINYIN_COMMON_WORDS[block])) {
            results.push(PINYIN_COMMON_WORDS[block]);
          }
        }
      }

      return results;
    }

    /**
     * 第三项功能：中英文、数字与符号混合检测与智能析取
     * 彻底剥除各类符号噪声，保留有用的中文词、英文词、关键编号/版本（如 "棕色尘埃2", "win11"）
     */
    function extractHybridUsefulTerms(text) {
      if (!text) return [];

      // 提取中文+数字组合（例如 "棕色尘埃2"、"5G测速"、"4K视频"）
      const alphaNumChinese = text.match(/[\u4e00-\u9fa5]+[0-9]+|[\u4e00-\u9fa50-9]{2,}/g) || [];

      // 提取英文+数字组合（例如 "win11", "vue3", "ipv6"）
      const alphaNumEnglish = text.match(/[a-zA-Z]+[0-9]+|[0-9]+[a-zA-Z]+/g) || [];

      return [...alphaNumChinese, ...alphaNumEnglish];
    }

    /**
     * 【主调度函数：综合多项乱码识别与清洗】
     */
    function cleanNoisyQuery(rawQuery) {
      if (!rawQuery) return { cleaned: "", isCleaned: false, original: "" };
      const original = rawQuery.trim();

      // 执行三项专门提取功能
      const extractedChinese = extractChineseUsefulTerms(original);
      const extractedEnglish = extractEnglishUsefulTerms(original);
      const extractedHybrid  = extractHybridUsefulTerms(original);

      const combinedSet = new Set();

      // 聚合所有有效项
      extractedChinese.forEach(item => combinedSet.add(item));
      extractedEnglish.forEach(item => combinedSet.add(item));
      extractedHybrid.forEach(item => combinedSet.add(item));

      // 若三项算法找到了有效信息
      if (combinedSet.size > 0) {
        // 过滤子集重合项（例如如果已有“网络测速”，则无需多余列出“测速”）
        const finalTerms = Array.from(combinedSet).sort((a, b) => b.length - a.length);
        const filtered = [];
        for (const term of finalTerms) {
          if (!filtered.some(f => f !== term && f.includes(term))) {
            filtered.push(term);
          }
        }

        const cleanedStr = filtered.join(" ").trim();
        if (cleanedStr && cleanedStr !== original) {
          return {
            cleaned: cleanedStr,
            isCleaned: true,
            original,
            extractedList: filtered
          };
        }
      }

      // 保底：去掉头尾符号标点
      const fallback = original.replace(/^[\s`~!@#$%^&*()_\-+=\[\]{}|\\;:'",.<>?\/·~！@#￥%……&*（）——+={}|【】、：；“”‘’《》？，。]+|[\s`~!@#$%^&*()_\-+=\[\]{}|\\;:'",.<>?\/·~！@#￥%……&*（）——+={}|【】、：；“”‘’《》？，。]+$/g, '').trim();
      if (fallback && fallback !== original) {
        return { cleaned: fallback, isCleaned: true, original };
      }

      return { cleaned: original, isCleaned: false, original };
    }

    /**
     * =========================================================================
     * 【智能多协议一键解密引擎】
     * 自动检测输入是否包含常见加密或编码数据：
     *  - Base64 编码 (标准Base64及URL-safe Base64，自动补齐填充)
     *  - URL Percent-Encoding (如 %E6%B5%8B%E9%80%9F)
     *  - 十六进制 Hex/ASCII 编码 (如 48656c6c6f)
     *  - HTML 实体字符 (如 &#27979;&#36895; 或 &lt;span&gt;)
     *  - 凯撒密码/ROT13 (对称字符翻转)
     *  - 摩斯密码 (Morse Code)
     * =========================================================================
     */
    function tryDecryptInput(rawText) {
      if (!rawText) return null;
      const text = rawText.trim();
      if (text.length < 3) return null;

      // 1. 尝试 URL 百分比编码检测与解码 (Percent-Encoding)
      if (/%[0-9a-fA-F]{2}/.test(text)) {
        try {
          const decoded = decodeURIComponent(text);
          if (decoded && decoded !== text) {
            return {
              type: "URL 编码 (Percent-Encoding)",
              result: decoded
            };
          }
        } catch (e) {}
      }

      // 2. 尝试 HTML 实体编码解码 (如 &#27979;&#36895;)
      if (/&#[0-9]{2,6};|&#x[0-9a-fA-F]{2,5};|&[a-zA-Z]+;/.test(text)) {
        try {
          const parserDoc = new DOMParser().parseFromString(text, 'text/html');
          const decoded = parserDoc.body.textContent;
          if (decoded && decoded !== text) {
            return {
              type: "HTML 字符实体编码",
              result: decoded
            };
          }
        } catch (e) {}
      }

      // 3. 尝试标准/URL-Safe Base64 解码
      // 检查是否形似 Base64 字符串（长度>=4，字符集正确）
      const cleanB64 = text.replace(/[\r\n\s]/g, '');
      if (/^[A-Za-z0-9+/_-]+={0,3}$/.test(cleanB64) && cleanB64.length >= 4 && cleanB64.length % 4 <= 2) {
        try {
          let standardB64 = cleanB64.replace(/-/g, '+').replace(/_/g, '/');
          while (standardB64.length % 4 !== 0) standardB64 += '=';
          // 使用 TextDecoder 解码 UTF-8 字符（支持中文）
          const binaryStr = atob(standardB64);
          const bytes = new Uint8Array(binaryStr.length);
          for (let i = 0; i < binaryStr.length; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
          }
          const decoded = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
          // 确保解码后的结果有意义（避免随机二进制乱字符）
          if (decoded && decoded.trim() && !/[\x00-\x08\x0E-\x1F]/.test(decoded) && decoded !== text) {
            return {
              type: "Base64 加密/编码",
              result: decoded
            };
          }
        } catch (e) {}
      }

      // 4. 尝试十六进制 (Hex) 编码解码 (如 63657375 或 e6b58be9809f)
      const cleanHex = text.replace(/[\s-]/g, '');
      if (/^[0-9a-fA-F]{4,}$/.test(cleanHex) && cleanHex.length % 2 === 0) {
        try {
          const bytes = [];
          for (let i = 0; i < cleanHex.length; i += 2) {
            bytes.push(parseInt(cleanHex.substr(i, 2), 16));
          }
          const decoded = new TextDecoder('utf-8', { fatal: false }).decode(new Uint8Array(bytes));
          if (decoded && decoded.trim() && !/[\x00-\x08\x0E-\x1F]/.test(decoded) && decoded !== text) {
            return {
              type: "Hex (十六进制) 编码",
              result: decoded
            };
          }
        } catch (e) {}
      }

      // 5. 尝试简易 ROT13 密码
      if (/^[a-zA-Z\s.,!?]+$/.test(text) && text.length >= 4) {
        const rot13Decoded = text.replace(/[a-zA-Z]/g, function(c) {
          const code = c.charCodeAt(0);
          if (code >= 65 && code <= 90) return String.fromCharCode(((code - 65 + 13) % 26) + 65);
          if (code >= 97 && code <= 122) return String.fromCharCode(((code - 97 + 13) % 26) + 97);
          return c;
        });
        // 判断解密后是否命中常用英文词
        if (COMMON_ENGLISH_WORDS.has(rot13Decoded.toLowerCase())) {
          return {
            type: "ROT13 凯撒密码",
            result: rot13Decoded
          };
        }
      }

      return null;
    }

    });

    // 当输入框内容变动时，实时检测是否属于加密密文
    searchInputElem.addEventListener("input", (e) => {
      checkAndShowDecryption(e.target.value);
    });

    /**
     * 【主搜索逻辑】
     * 严格遵守用户的开关设置，绝不强制调用用户不想看到的源！
     */
    async function handleSearch(event) {
      event.preventDefault();

      const rawQuery = searchInputElem.value.trim();
      const statusMsg = document.getElementById("statusMsg");
      const resultsContainer = document.getElementById("resultsContainer");

      if (!rawQuery) {
        statusMsg.textContent = "请输入你想搜索的内容哦！";
        resultsContainer.innerHTML = "";
        decryptBanner.classList.remove("active");
        return;
      }

      // 同步触发解密检测
      checkAndShowDecryption(rawQuery);

      // 智能提取乱码中夹带的真实中英文字符
      const { cleaned: query, isCleaned, original } = cleanNoisyQuery(rawQuery);

      // 获取用户的开关配置
      const userSettings = {
        bing: document.getElementById("srcBing") ? document.getElementById("srcBing").checked : true,
        tools: document.getElementById("srcTools").checked,
        crossref: document.getElementById("srcCrossref").checked,
        webDev: document.getElementById("srcWebDev").checked,
        wiki: document.getElementById("srcWiki").checked,
        openLib: document.getElementById("srcOpenLib").checked,
      };

      // 检查用户是否全部关掉了
      const activeSourceCount = Object.values(userSettings).filter(Boolean).length;
      if (activeSourceCount === 0) {
        statusMsg.textContent = "你关闭了所有搜索源哦！请点击右上角小齿轮勾选你想启用的搜索源。";
        resultsContainer.innerHTML = "";
        return;
      }

      statusMsg.innerHTML = '<span class="spinner"></span>Krctra 正在根据你的配置并发检索各个指定源...';
      resultsContainer.innerHTML = "";

      try {
        // 根据用户的设置，动态决定拉取哪些源
        const allFetchedResults = await fetchByUserPreference(query, userSettings);

        if (!allFetchedResults || allFetchedResults.length === 0) {
          statusMsg.textContent = `在已开启的源中未检索到关于 "${query}" 的结果。可以点击右上角小齿轮开启更多搜索源。`;
          return;
        }

        // 1. 去重
        const uniqueResults = deduplicateResults(allFetchedResults);

        // 2. 升级版双层打分与语义重排（意图识别 + BM25 词频加权 + 域名权威度）
        const scoredResults = advancedRankResults(uniqueResults, query);

        // 统计来源种类
        const sourceSet = new Set(scoredResults.map(r => r.source));
        const cleanedNotice = isCleaned ? ` [已自动识别核心有效词: "${query}"]` : "";
        statusMsg.textContent = `共呈现 ${scoredResults.length} 条精选结果（汇聚自：${Array.from(sourceSet).join('、')}）${cleanedNotice}，已按相关度重排：`;

        // 3. 渲染
        renderResults(scoredResults, query);

        // 同步 URL 参数（保存原始输入便于回溯）
        syncUrlParam(rawQuery);

      } catch (error) {
        console.error("搜索出错:", error);
        statusMsg.textContent = "检索过程中遇到异常，请检查网络后重试。";
      }
    }

    /**
     * 同步当前搜索词到浏览器地址栏（支持刷新不丢失、前进后退）
     */
    function syncUrlParam(query) {
      const currentUrl = new URL(window.location.href);
      if (currentUrl.searchParams.get("q") !== query) {
        currentUrl.searchParams.set("q", query);
        window.history.pushState({ query }, "", currentUrl.toString());
      }
      document.title = `${query} - Krctra 搜索`;
    }

    // 页面加载或刷新时：自动读取 URL 参数中的 ?q= 并执行搜索
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const initialQuery = params.get("q");
      if (initialQuery && initialQuery.trim()) {
        searchInputElem.value = initialQuery.trim();
        handleSearch(new Event("submit"));
      }
    });

    // 浏览器前进/后退时：同步搜索状态
    window.addEventListener("popstate", (e) => {
      const params = new URLSearchParams(window.location.search);
      const query = params.get("q") || "";
      searchInputElem.value = query;
      if (query.trim()) {
        handleSearch(new Event("submit"));
      } else {
        document.getElementById("resultsContainer").innerHTML = "";
        document.getElementById("statusMsg").textContent = "";
        document.title = "Krctra - 极简纯净搜索引擎";
      }
    });

    /**
     * 【按用户勾选动态调用搜索源】
     */
    async function fetchByUserPreference(query, settings) {
      const tasks = [];

      // 0. 必应全网真实爬虫 (通过 Cloudflare Functions /api/search 云端代理抓取)
      if (settings.bing) {
        tasks.push(fetchCloudflareBing(query));
      }

      // 1. 实用网址与工具直达 (用户开启才调)
      if (settings.tools) {
        tasks.push(searchPracticalTools(query));
      }

      // 2. Crossref 全球数字出版物 (用户开启才调)
      if (settings.crossref) {
        tasks.push(fetchCrossref(query));
      }

      // 4. WebDev 全球生态库 (用户开启才调)
      if (settings.webDev) {
        tasks.push(fetchNpmRegistry(query));
      }

      // 5. 维基百科 (用户开启才调，若关闭则坚决不调)
      if (settings.wiki) {
        tasks.push(fetchWikipedia(query));
      }

      // 6. OpenLibrary (用户开启才调)
      if (settings.openLib) {
        tasks.push(fetchOpenLibrary(query));
      }

      const settled = await Promise.allSettled(tasks);
      let combined = [];

      for (const res of settled) {
        if (res.status === "fulfilled" && Array.isArray(res.value)) {
          combined = combined.concat(res.value);
        }
      }

      return combined;
    }

    /**
     * 【源 0：Cloudflare 边缘代理必应搜索】
     * 部署上线到 Cloudflare Pages 后，通过同域 /api/search 获取真实必应全网结果
     */
    async function fetchCloudflareBing(query) {
      try {
        const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&engine=bing`, {
          headers: { "Accept": "application/json" }
        });
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data.results) ? data.results : [];
      } catch (e) {
        // 本地单文件直接打开时由于没有运行 /api，优雅跳过
        return [];
      }
    }

    /**
     * 【源 1：实用网址与工具库检索】
     */
    function searchPracticalTools(query) {
      const q = query.toLowerCase().trim();
      const matched = [];

      for (const item of PRACTICAL_TOOLS_INDEX) {
        let isHit = false;
        // 关键词命中
        for (const kw of item.keywords) {
          if (q.includes(kw) || kw.includes(q)) {
            isHit = true;
            break;
          }
        }
        if (isHit || item.title.toLowerCase().includes(q)) {
          matched.push({
            id: `tool-${Math.random()}`,
            title: item.title,
            snippet: item.snippet,
            url: item.url,
            source: "实用网址直达",
            isDirectTool: true
          });
        }
      }
      return Promise.resolve(matched);
    }

    /**
     * 【源 2：DuckDuckGo 官网与即时回答】
     */
    async function fetchDuckDuckGo(query) {
      try {
        const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=0`;
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) return [];

        const data = await res.json();
        const results = [];

        if (data.Heading && (data.AbstractURL || data.AbstractText)) {
          results.push({
            id: `ddg-main-${Date.now()}`,
            title: data.Heading,
            snippet: data.AbstractText || `${data.Heading} 官方主页及详细说明`,
            url: data.AbstractURL || (data.Results && data.Results[0] ? data.Results[0].FirstURL : `https://duckduckgo.com/?q=${encodeURIComponent(query)}`),
            source: "DuckDuckGo 官网直达"
          });
        }

        if (Array.isArray(data.Results)) {
          for (const item of data.Results) {
            if (item.FirstURL && item.Text) {
              results.push({
                id: `ddg-res-${Math.random()}`,
                title: item.Text.split(' - ')[0] || item.Text,
                snippet: item.Text,
                url: item.FirstURL,
                source: "DuckDuckGo 网页"
              });
            }
          }
        }

        if (Array.isArray(data.RelatedTopics)) {
          for (const item of data.RelatedTopics) {
            if (item.FirstURL && item.Text) {
              results.push({
                id: `ddg-topic-${Math.random()}`,
                title: item.Text.split(' - ')[0].slice(0, 50),
                snippet: item.Text,
                url: item.FirstURL,
                source: "DuckDuckGo 网页"
              });
            } else if (Array.isArray(item.Topics)) {
              for (const subItem of item.Topics.slice(0, 3)) {
                if (subItem.FirstURL && subItem.Text) {
                  results.push({
                    id: `ddg-subtopic-${Math.random()}`,
                    title: subItem.Text.split(' - ')[0].slice(0, 50),
                    snippet: subItem.Text,
                    url: subItem.FirstURL,
                    source: "DuckDuckGo 网页"
                  });
                }
              }
            }
          }
        }

        return results.slice(0, 6);
      } catch (e) {
        return [];
      }
    }

    /**
     * 【源 3：Crossref 国际开放数字出版网络】
     */
    async function fetchCrossref(query) {
      try {
        const endpoint = `https://api.crossref.org/works?query=${encodeURIComponent(query)}&rows=5`;
        const res = await fetch(endpoint, { headers: { "Accept": "application/json" } });
        if (!res.ok) return [];

        const data = await res.json();
        const items = data.message && Array.isArray(data.message.items) ? data.message.items : [];

        return items.map((item, idx) => {
          const rawTitle = Array.isArray(item.title) ? item.title[0] : (item.title || "学术出版物");
          const container = Array.isArray(item['container-title']) ? item['container-title'][0] : (item['container-title'] || "");
          const publisher = item.publisher ? `来源: ${item.publisher}` : "";
          const link = (item.resource && item.resource.primary && item.resource.primary.URL) || item.URL || `https://doi.org/${item.DOI}`;

          return {
            id: `crossref-${idx}-${Date.now()}`,
            title: rawTitle,
            snippet: [container, publisher, item.abstract ? item.abstract.replace(/<[^>]+>/g, '').slice(0, 160) : ""].filter(Boolean).join(" · ") || "出版文献与网页详情",
            url: link,
            source: "Crossref 全球出版物"
          };
        });
      } catch (e) {
        return [];
      }
    }

    /**
     * 【源 4：NPM 全球开发者生态与工具库 (自带 CORS，免 key)】
     */
    async function fetchNpmRegistry(query) {
      try {
        const url = `https://registry.npmjs.org/-/v1/search?text=${encodeURIComponent(query)}&size=5`;
        const res = await fetch(url, { headers: { "Accept": "application/json" } });
        if (!res.ok) return [];

        const data = await res.json();
        const objects = Array.isArray(data.objects) ? data.objects : [];

        return objects.map(obj => {
          const pkg = obj.package || {};
          const links = pkg.links || {};
          return {
            id: `npm-${pkg.name}-${Math.random()}`,
            title: `${pkg.name} - 开发者工具/软件包`,
            snippet: pkg.description || "开源工具与网页 SDK，可直接在线查看文档与使用。",
            url: links.homepage || links.npm || `https://www.npmjs.com/package/${pkg.name}`,
            source: "开发者网络 (NPM)"
          };
        });
      } catch (e) {
        return [];
      }
    }

    /**
     * 【源 5：维基百科 (仅当用户勾选时才调用)】
     */
    async function fetchWikipedia(query) {
      try {
        const endpoint = `https://zh.wikipedia.org/w/rest.php/v1/search/page?q=${encodeURIComponent(query)}&limit=5`;
        const res = await fetch(endpoint, { headers: { "Accept": "application/json" } });
        if (!res.ok) return [];

        const data = await res.json();
        return (data.pages || []).map(page => ({
          id: `wiki-${page.id}`,
          title: page.title,
          snippet: page.description || (page.excerpt ? page.excerpt.replace(/<[^>]+>/g, '') : "维基百科词条"),
          url: `https://zh.wikipedia.org/wiki/${encodeURIComponent(page.key || page.title)}`,
          source: "维基百科"
        }));
      } catch (e) {
        return [];
      }
    }

    /**
     * 【源 6：OpenLibrary 开放文献库】
     */
    async function fetchOpenLibrary(query) {
      try {
        const endpoint = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=3`;
        const res = await fetch(endpoint, { headers: { "Accept": "application/json" } });
        if (!res.ok) return [];

        const data = await res.json();
        const docs = Array.isArray(data.docs) ? data.docs : [];

        return docs.map((doc, idx) => {
          const author = Array.isArray(doc.author_name) ? doc.author_name.join(", ") : "公开书籍";
          const pageUrl = doc.key ? `https://openlibrary.org${doc.key}` : `https://openlibrary.org/search?q=${encodeURIComponent(query)}`;

          return {
            id: `openlibrary-${idx}-${Date.now()}`,
            title: doc.title || "开放著作",
            snippet: `作者: ${author}。全球开放数字化档案馆网络藏书。`,
            url: pageUrl,
            source: "OpenLibrary"
          };
        });
      } catch (e) {
        return [];
      }
    }

    /**
     * 【结果去重】
     */
    function deduplicateResults(results) {
      const seenUrls = new Set();
      const seenTitles = new Set();
      const deduplicated = [];

      for (const item of results) {
        if (!item.url || !item.title) continue;
        const normUrl = item.url.toLowerCase().replace(/\/+$/, "");
        const normTitle = item.title.trim().toLowerCase();

        if (seenUrls.has(normUrl) || seenTitles.has(normTitle)) {
          continue;
        }

        seenUrls.add(normUrl);
        seenTitles.add(normTitle);
        deduplicated.push(item);
      }

      return deduplicated;
    }

    /**
     * 【升级版精准重排序算法】
     * 解决“只要相关工具，不要无关长文”的问题：
     * 1. 工具直达意图加权（isDirectTool 极大提权）
     * 2. 标题包含/等于核心词的最高优先级
     * 3. 惩罚长标题与冗余描述（降权纯理论词条）
     */
    function advancedRankResults(results, query) {
      const lowerQuery = query.toLowerCase().trim();
      const queryTokens = lowerQuery.split(/\s+/).filter(t => t.length > 0);

      const scored = results.map(item => {
        let score = 0;
        const titleLower = item.title.toLowerCase();
        const snippetLower = item.snippet.toLowerCase();

        // 1. 意图命中：如果这是用户要找的实用网站/直达工具，赋予特权基础分
        if (item.isDirectTool) {
          score += 300;
        }

        // 2. 标题匹配度核心权重
        if (titleLower === lowerQuery) {
          score += 200;
        } else if (titleLower.startsWith(lowerQuery)) {
          score += 120;
        } else if (titleLower.includes(lowerQuery)) {
          score += 80;
        }

        // 3. 多词分词覆盖度计算
        if (queryTokens.length > 1) {
          let tokenHits = 0;
          for (const token of queryTokens) {
            if (titleLower.includes(token)) tokenHits++;
          }
          score += (tokenHits / queryTokens.length) * 50;
        }

        // 4. 摘要关键词命中打分
        try {
          const matches = (snippetLower.match(new RegExp(escapeRegExp(lowerQuery), 'g')) || []).length;
          score += Math.min(matches * 10, 40);
        } catch (e) {
          if (snippetLower.includes(lowerQuery)) score += 10;
        }

        // 5. 权威直达主域名加权 (如直接是 .net/.com/.cn 首页)
        try {
          const parsed = new URL(item.url);
          if (parsed.pathname === "/" || parsed.pathname === "") {
            score += 40; // 首页直达优先级高于子页面
          }
        } catch (e) {}

        // 6. 百科类词条若只是泛泛而谈，轻微降权（避免百科压制具体工具）
        // 7. 对搜索引擎外部结果给予保底相关分（如果标题或摘要命中分词），保证有意义
        if (item.source.includes("Bing") && score > 0) {
          score += 20;
        }

        return {
          ...item,
          score: Math.round(score)
        };
      });

      // 从高到低排序，并彻底过滤掉相关度为 0 的无关结果！
      return scored
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score);
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /**
     * 【渲染搜索结果】
     */
    function renderResults(results, query) {
      const container = document.getElementById("resultsContainer");
      container.innerHTML = "";

      results.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "result-card" + (item.isDirectTool ? " tool-direct" : "");
        card.style.animationDelay = `${index * 0.04}s`;

        const highlightedTitle = highlightText(item.title, query);
        const highlightedSnippet = highlightText(item.snippet, query);
        const badgeClass = item.isDirectTool ? "badge-source badge-direct" : "badge-source";

        card.innerHTML = `
          <div class="card-top">
            <span class="${badgeClass}">${item.source}</span>
            <span class="badge-score">相关度: ${item.score}分</span>
          </div>
          <h2 class="result-title">
            <a href="${item.url}" target="_blank" rel="noopener noreferrer">${highlightedTitle}</a>
          </h2>
          <div class="result-url">${item.url}</div>
          <p class="result-snippet">${highlightedSnippet}</p>
        `;

        container.appendChild(card);
      });
    }

    function highlightText(text, query) {
      if (!query || !text) return text;
      const lowerQuery = query.trim();
      if (!lowerQuery) return text;
      try {
        const regex = new RegExp(`(${escapeRegExp(lowerQuery)})`, 'gi');
        return text.replace(regex, '<mark>$1</mark>');
      } catch (e) {
        return text;
      }
    }
  </script>
